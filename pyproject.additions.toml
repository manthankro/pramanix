# pyproject.toml  (merge into the sections you already have)
[project]
dependencies = [
    # keep your existing fastapi, uvicorn, pydantic, langgraph, langchain-core ...
    "langchain-google-genai>=2.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    # keep your existing pytest, ruff, mypy ...
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[[tool.mypy.overrides]]
module = ["langchain_google_genai.*"]
ignore_missing_imports = true
