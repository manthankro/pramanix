[project]
name = "pramanix-agent"
version = "0.1.0"
description = "Autonomous AI Agent built with LangGraph and FastAPI"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.111.0",
    "langchain>=0.2.0",
    "langgraph>=0.0.60",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "chromadb>=0.5.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.6",
    "pytest-mock>=3.14.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --asyncio-mode=auto"
testpaths = ["tests"]