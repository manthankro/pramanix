<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pramanix Project Agent</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .chat-container { width: 450px; background: #1e293b; border-radius: 12px; display: flex; flex-direction: column; height: 600px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); overflow: hidden; }
        .chat-header { background: #0f172a; padding: 15px; font-weight: bold; border-bottom: 1px solid #334155; text-align: center; }
        .chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .message { padding: 10px 14px; border-radius: 8px; max-width: 80%; line-height: 1.4; font-size: 14px; word-break: break-word; }
        .user { background: #3b82f6; align-self: flex-end; color: white; }
        .agent { background: #334155; align-self: flex-start; color: #f1f5f9; white-space: pre-wrap; }
        .input-area { display: flex; padding: 12px; background: #0f172a; border-top: 1px solid #334155; }
        input { flex: 1; background: #1e293b; border: 1px solid #475569; color: white; padding: 10px; border-radius: 6px; outline: none; }
        button { background: #3b82f6; color: white; border: none; padding: 0 16px; margin-left: 8px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button:hover { background: #2563eb; }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">Pramanix Project Agent</div>
        <div class="chat-box" id="chatBox">
            <div class="message agent">Hello! How can I help with your project today?</div>
        </div>
        <div class="input-area">
            <input type="text" id="userInput" placeholder="Ask anything about your project..." onkeypress="handleKey(event)">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        async function sendMessage() {
            const input = document.getElementById('userInput');
            const chatBox = document.getElementById('chatBox');
            const text = input.value.trim();
            if (!text) return;

            chatBox.innerHTML += `<div class="message user">${text}</div>`;
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ session_id: "test_session_123", message: text })
                });
                const data = await response.json();
                const reply = typeof data === 'string' ? data : JSON.stringify(data, null, 2);
                chatBox.innerHTML += `<div class="message agent">${reply}</div>`;
            } catch (err) {
                chatBox.innerHTML += `<div class="message agent" style="color:#ef4444;">Error connecting to agent.</div>`;
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function handleKey(e) {
            if (e.key === 'Enter') sendMessage();
        }
    </script>
</body>
</html>
